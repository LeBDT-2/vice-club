<div style="font-family:Arial,Helvetica,sans-serif;max-width:520px;margin:0 auto;padding:24px;background:#0f1424;color:#f4f1fb">
  <h1 style="color:#ff4fa3;font-size:22px;margin:0 0 16px">Changement d'adresse e-mail</h1>
  <p>Confirme le changement d'adresse de ton compte VICE CLUB de <strong>{{ .Email }}</strong> vers <strong>{{ .NewEmail }}</strong> :</p>
  <p style="margin:24px 0">
    <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email_change&next=/compte"
       style="background:#2ee6d6;color:#0b0f1d;padding:12px 20px;border-radius:8px;text-decoration:none;font-weight:bold">Confirmer le changement</a>
  </p>
  <p style="font-size:13px;color:#b9b3cc">Si tu n'es pas à l'origine de cette demande, ne clique pas et change ton mot de passe.</p>
</div>
